<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/conta_cadastrar.js" defer></script>
    <title>Cadastro da Conta</title>
</head>

<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <span class="titulo_menu">Conta Corrente</span>&emsp;
            <a href="./conta_cadastrar.html">Cadastrar</a>&emsp;
            <a href="./conta_consultar.html">Consultar</a>&emsp;
            <br><br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Cadastro de Conta</h1>
        <br><br>
        <form>
            <label for="numConta">Número da Conta</label><br>
            <input type="number" id="numConta" required><br><br>

            <label for="tipoConta">Tipo de Conta</label><br>
            <select id="tipoConta" style="padding: 5px; width: 220px;" required>
                <option value="">Selecione...</option>
                <option value="CORRENTE">CORRENTE</option>
                <option value="POUPANCA">POUPANCA</option>
            </select><br><br>

            <label for="saldo">Saldo Inicial (R$)</label><br>
            <input type="number" step="0.01" id="saldo" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button><br><br><br>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>

</html>
